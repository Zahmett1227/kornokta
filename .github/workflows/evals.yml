name: evals

# `ios/**` is in the trigger because `evals/tests/test_swift_contract_sync.py`
# reads the Swift enums and checks them against the §14 schema. Without it,
# editing an enum would skip the very check that exists to catch that edit.
on:
  push:
    paths:
      - "evals/**"
      - "backend/schemas/**"
      - "ios/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - "backend/schemas/**"
      - "ios/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt
      - name: Validate gold manifest
        run: python -m evals.ocr_eval.validate_manifest evals/gold-manifest.json
      - name: Run unit tests
        run: python -m pytest evals -q
      # The backend runs a generated copy of the detector. These fail if the
      # Python source changed without regenerating, which would leave the two
      # implementations quietly applying different rules.
      - name: Generated patterns are current
        run: python -m evals.ocr_eval.export_patterns --check
      - name: Shared detector cases are current
        run: python -m evals.ocr_eval.export_cases --check
      - name: Shared gate cases are current
        run: python -m evals.ocr_eval.export_gate_cases --check
      - name: Marker-detection smoke test
        run: python -m evals.spikes.marker_detection.run --demo
      - name: Provider-compare dry run (no keys)
        run: python -m evals.spikes.provider_compare.run --dry-run

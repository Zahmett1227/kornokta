# XcodeGen spec — `xcodegen generate` in this directory produces Cizgi.xcodeproj.
#
# The project file is generated rather than committed so the repo stays
# reviewable: a .pbxproj is unreadable in diffs and conflicts on every change.
# See README.md for the manual Xcode route if you prefer not to install
# XcodeGen.

name: Cizgi
options:
  bundleIdPrefix: local.cizgi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CizgiCore:
    path: CizgiCore

targets:
  Cizgi:
    type: application
    platform: iOS
    sources:
      - path: App
      # Gömülü yazı ailesi burada yaşıyor (Kemik & Oxblood tasarım dili).
      # README paketlenmesin: kaynak klasörü belge de taşıyor.
      - path: Resources
        buildPhase: resources
        excludes:
          - "README.md"
    dependencies:
      - package: CizgiCore
    # Şema da üretilsin. Elle yazılan bir şema bu projede bir kez `Run`'ı
    # sessizce bozdu: `LaunchAction`'ında `BuildableProductRunnable` yoktu, bu
    # yüzden Xcode "Build Succeeded" diyor ama telefona hiçbir şey kurmuyordu.
    # Üretilen şema paylaşılan (xcshareddata) olur, yani hem Xcode hem
    # komut satırındaki `xcodebuild -scheme Cizgi` aynı tanımı kullanır.
    scheme:
      testTargets: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Çizgi
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Tasarım dilinin serif ailesi. Dosya `Resources/` içine konmadıysa
        # iOS yalnız bir uyarı basar; `Cizgi.serif(_:)` Georgia'ya düşer.
        UIAppFonts:
          - LibreCaslonText-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required before VNDocumentCameraViewController may open the camera.
        NSCameraUsageDescription: >-
          Kitap sayfalarındaki işaretlediğin bölümleri karta dönüştürmek için
          kamerayı kullanır. Görüntüler yalnız cihazında saklanır.
        NSPhotoLibraryUsageDescription: >-
          Daha önce çektiğin sayfa fotoğraflarını içe aktarmak için kullanılır.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.cizgi.app
        # Cihaza derlemek için şart, ve burada durması şart: proje dosyası
        # üretiliyor, yani `xcodegen generate` her koşuşta Xcode'da elle
        # seçilmiş takımı siler. Bu, şemanın Run'ı sessizce bozmasıyla
        # (cdc2e38) aynı sınıf tuzak — fark yalnız bu sefer gürültülü
        # patlaması ("Signing for 'Cizgi' requires a development team").
        # Takım kimliği gizli değil; imzalı her uygulama paketinde duruyor.
        # Tek kullanıcılık bir uygulama olduğu için sabitlemek doğru
        # (ANA-PLAN §0.5'in kişisel kullanım çerçevesi).
        DEVELOPMENT_TEAM: "3MYXAUHX44"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

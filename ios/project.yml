# XcodeGen spec — `xcodegen generate` in this directory produces Cizgi.xcodeproj.
#
# The project file is generated rather than committed so the repo stays
# reviewable: a .pbxproj is unreadable in diffs and conflicts on every change.
# See README.md for the manual Xcode route if you prefer not to install
# XcodeGen.

name: Cizgi
options:
  bundleIdPrefix: local.cizgi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CizgiCore:
    path: CizgiCore

targets:
  Cizgi:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CizgiCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Çizgi
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required before VNDocumentCameraViewController may open the camera.
        NSCameraUsageDescription: >-
          Kitap sayfalarındaki işaretlediğin bölümleri karta dönüştürmek için
          kamerayı kullanır. Görüntüler yalnız cihazında saklanır.
        NSPhotoLibraryUsageDescription: >-
          Daha önce çektiğin sayfa fotoğraflarını içe aktarmak için kullanılır.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.cizgi.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
